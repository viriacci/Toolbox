name: Build Network Host V34

on:
  push:
    paths:
      - 'networkhost/**'
      - '.github/workflows/build-network-host-v34.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: networkhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: networkhost/go.sum

      - name: Resolve dependencies
        shell: pwsh
        run: |
          go get github.com/jchv/go-webview2@master
          go mod tidy

      - name: Patch go-webview2 existing HWND support
        shell: pwsh
        run: |
          $modDir = (go list -m -f '{{.Dir}}' github.com/jchv/go-webview2).Trim()
          if (!(Test-Path $modDir)) { throw "Nie znaleziono modułu go-webview2: $modDir" }
          attrib -R (Join-Path $modDir 'common.go')
          attrib -R (Join-Path $modDir 'webview.go')
          python .\patch_webview.py $modDir
          gofmt -w (Join-Path $modDir 'common.go') (Join-Path $modDir 'webview.go')

      - name: Patch V34.5 z-order host
        shell: pwsh
        run: |
          python .\patch_v345.py
          gofmt -w .\main.go

      - name: Build x64 helper
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o ToolboxNetworkHost.exe .

      - name: Verify binary
        shell: pwsh
        run: |
          if (!(Test-Path .\ToolboxNetworkHost.exe)) { throw 'Brak ToolboxNetworkHost.exe' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\ToolboxNetworkHost.exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Niepoprawny nagłówek PE' }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch '34.5-zorder-top') { throw 'Brak markera hostBuild 34.5' }
          if ($ascii -notmatch 'explicit-static-child-hwnd-zorder-top') { throw 'Brak markera trybu z-order' }
          Get-FileHash .\ToolboxNetworkHost.exe -Algorithm SHA256 | Format-List

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: ToolboxNetworkHost-v34.5-x64
          path: networkhost/ToolboxNetworkHost.exe
          if-no-files-found: error
