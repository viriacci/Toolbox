name: Build Network Host V34

on:
  push:
    paths:
      - 'networkhost/**'
      - '.github/workflows/build-network-host-v34.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: networkhost
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: networkhost/go.sum

      - name: Resolve dependencies
        shell: pwsh
        run: |
          go get github.com/jchv/go-webview2@master
          go mod tidy

      - name: Stamp V34.3 session host
        shell: pwsh
        run: |
          $src = Get-Content .\main.go -Raw
          $src = $src.Replace('34.2-child-from-create', '34.3-session-host')
          Set-Content .\main.go -Value $src -Encoding UTF8
          if ((Get-Content .\main.go -Raw) -notmatch '34.3-session-host') { throw 'Nie udało się ustawić hostBuild V34.3' }

      - name: Build x64 helper
        shell: pwsh
        run: |
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          $env:CGO_ENABLED='0'
          go build -trimpath -ldflags '-H=windowsgui -s -w' -o ToolboxNetworkHost.exe .

      - name: Verify binary
        shell: pwsh
        run: |
          if (!(Test-Path .\ToolboxNetworkHost.exe)) { throw 'Brak ToolboxNetworkHost.exe' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .\ToolboxNetworkHost.exe))
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Niepoprawny nagłówek PE' }
          $ascii = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($ascii -notmatch '34.3-session-host') { throw 'Brak markera hostBuild 34.3' }
          Get-FileHash .\ToolboxNetworkHost.exe -Algorithm SHA256 | Format-List

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: ToolboxNetworkHost-v34.3-x64
          path: networkhost/ToolboxNetworkHost.exe
          if-no-files-found: error
